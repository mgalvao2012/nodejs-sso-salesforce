services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_dev
    ports: ["55432:5432"]
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
      - db-data:/var/lib/postgresql/data
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: app_test
    ports: ["55433:5432"]
    volumes:
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    tmpfs: /var/lib/postgresql/data
volumes:
  db-data:
